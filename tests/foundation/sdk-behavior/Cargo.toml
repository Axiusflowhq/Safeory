[package]
name = "safeory-foundation-sdk-behavior"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bitwarden-api-api = { path = "../../crates/bitwarden-api-api" }
bitwarden-core = { path = "../../crates/bitwarden-core", features = ["internal", "test-fixtures"] }
bitwarden-encoding = { path = "../../crates/bitwarden-encoding" }
bitwarden-exporters = { path = "../../crates/bitwarden-exporters" }
bitwarden-pm = { path = "../../crates/bitwarden-pm", features = ["wasm"] }
bitwarden-vault = { path = "../../crates/bitwarden-vault" }
serde_json = "=1.0.149"
tokio = { version = "=1.52.0", features = ["macros", "rt-multi-thread"] }

[workspace]
