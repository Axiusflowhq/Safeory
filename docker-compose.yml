name: safeory

services:
  postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-safeory}"
      POSTGRES_USER: "${POSTGRES_USER:-safeory}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  valkey:
    image: valkey/valkey:9.1.2-alpine3.24
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: "${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}"
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}"
      GARAGE_ADMIN_TOKEN: "${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}"
      GARAGE_METRICS_TOKEN: "${GARAGE_METRICS_TOKEN:?set GARAGE_METRICS_TOKEN in .env}"
      GARAGE_DEFAULT_ACCESS_KEY: "${GARAGE_DEFAULT_ACCESS_KEY:?set GARAGE_DEFAULT_ACCESS_KEY in .env}"
      GARAGE_DEFAULT_SECRET_KEY: "${GARAGE_DEFAULT_SECRET_KEY:?set GARAGE_DEFAULT_SECRET_KEY in .env}"
      GARAGE_DEFAULT_BUCKET: "${GARAGE_DEFAULT_BUCKET:-safeory-dev}"
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
      - "127.0.0.1:${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api-migrate:
    image: postgres:17.11-alpine3.24
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - ./apps/api/migrations:/migrations:ro
    command:
      - sh
      - -ec
      - >-
        for migration in /migrations/*.sql; do
          echo "Applying $${migration}";
          psql
          --host=postgres
          --username="${POSTGRES_USER:-safeory}"
          --dbname="${POSTGRES_DB:-safeory}"
          --set=ON_ERROR_STOP=1
          --file="$${migration}";
        done

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-safeory}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-safeory}"
      VALKEY_URL: "redis://:${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}@valkey:6379/"
      ACCOUNT_REGISTRATION_TOKEN: "${ACCOUNT_REGISTRATION_TOKEN:?set ACCOUNT_REGISTRATION_TOKEN in .env}"
      S3_ENDPOINT: "http://garage:3900"
      S3_REGION: "garage"
      S3_BUCKET: "${GARAGE_DEFAULT_BUCKET:-safeory-dev}"
      S3_ACCESS_KEY_ID: "${GARAGE_DEFAULT_ACCESS_KEY:?set GARAGE_DEFAULT_ACCESS_KEY in .env}"
      S3_SECRET_ACCESS_KEY: "${GARAGE_DEFAULT_SECRET_KEY:?set GARAGE_DEFAULT_SECRET_KEY in .env}"
      BIND_ADDR: "0.0.0.0:8080"
      RUST_LOG: "${RUST_LOG:-safeory_api=info}"
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  postgres-data:
  valkey-data:
  garage-meta:
  garage-data:
  mailpit-data:
