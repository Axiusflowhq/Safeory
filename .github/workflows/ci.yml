name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation-sdk-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install SDK proof system dependencies
        run: |
          npm install --global binaryen@132.0.0
          wasm-opt --version
          wasm2js --version
          rustup toolchain install 1.94.1 --profile minimal --component rust-src --component rustfmt --component clippy

      - name: Clone pinned Bitwarden SDK proof input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          SDK_REPOSITORY="$(node -p "require('./docs/provenance/foundation-seed.json').sources.sdk.repository")"
          SDK_COMMIT="$(node -p "require('./docs/provenance/foundation-seed.json').sources.sdk.commit")"
          git clone --no-checkout "$SDK_REPOSITORY" .proof/bitwarden-sdk-ci
          git -C .proof/bitwarden-sdk-ci checkout --detach "$SDK_COMMIT"
          test -z "$(git -C .proof/bitwarden-sdk-ci status --porcelain)"

      - name: Prepare and verify OSS-only SDK graph
        run: |
          node scripts/prepare-bitwarden-sdk-proof.mjs .proof/bitwarden-sdk-ci
          node scripts/check-bitwarden-sdk-proof.mjs .proof/bitwarden-sdk-ci

      - name: Install SDK JavaScript build tooling
        working-directory: .proof/bitwarden-sdk-ci
        run: npm ci --ignore-scripts

      - name: Check cleaned SDK workspace
        working-directory: .proof/bitwarden-sdk-ci
        run: cargo check --workspace --locked

      - name: Test retained SDK libraries
        working-directory: .proof/bitwarden-sdk-ci
        run: cargo test --workspace --locked --lib

      - name: Apply and verify Safeory SDK behavior adapters
        run: |
          node scripts/prepare-safeory-sdk-adapter-proof.mjs .proof/bitwarden-sdk-ci
          node scripts/check-safeory-sdk-adapter-proof.mjs .proof/bitwarden-sdk-ci

      - name: Install Safeory-owned SDK behavior harness
        run: node scripts/prepare-bitwarden-sdk-behavior-proof.mjs .proof/bitwarden-sdk-ci

      - name: Run Safeory-owned SDK behavior proof
        working-directory: .proof/bitwarden-sdk-ci
        run: CARGO_TARGET_DIR=target cargo test --manifest-path .safeory/sdk-behavior/Cargo.toml --locked

      - name: Build adapted release WASM SDK
        working-directory: .proof/bitwarden-sdk-ci
        run: bash crates/bitwarden-wasm-internal/build.sh -r

      - name: Re-check SDK boundary after build
        run: |
          node scripts/check-bitwarden-sdk-proof.mjs .proof/bitwarden-sdk-ci
          node scripts/check-safeory-sdk-adapter-proof.mjs .proof/bitwarden-sdk-ci

  foundation-server-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install .NET 10.0.103
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.103

      - name: Install server Rust toolchains
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Clone pinned Bitwarden server proof input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          SERVER_REPOSITORY="$(node -p "require('./docs/provenance/foundation-seed.json').sources.server.repository")"
          SERVER_COMMIT="$(node -p "require('./docs/provenance/foundation-seed.json').sources.server.commit")"
          git clone --no-checkout "$SERVER_REPOSITORY" .proof/bitwarden-server-ci
          git -C .proof/bitwarden-server-ci checkout --detach "$SERVER_COMMIT"
          test -z "$(git -C .proof/bitwarden-server-ci status --porcelain)"

      - name: Prepare and verify OSS-only server graph
        run: |
          node scripts/prepare-bitwarden-server-proof.mjs .proof/bitwarden-server-ci
          node scripts/check-bitwarden-server-proof.mjs .proof/bitwarden-server-ci

      - name: Restore server-local .NET tools
        working-directory: .proof/bitwarden-server-ci
        run: dotnet tool restore

      - name: Build cleaned self-hosted server composition
        working-directory: .proof/bitwarden-server-ci
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            src/Admin/Admin.csproj
            src/Api/Api.csproj
            src/Billing/Billing.csproj
            src/Events/Events.csproj
            src/EventsProcessor/EventsProcessor.csproj
            src/Icons/Icons.csproj
            src/Identity/Identity.csproj
            src/Notifications/Notifications.csproj
            util/Migrator/Migrator.csproj
            util/PostgresMigrations/PostgresMigrations.csproj
            util/SeederApi/SeederApi.csproj
            util/Setup/Setup.csproj
            AppHost/AppHost.csproj
          )
          for project in "${projects[@]}"; do
            dotnet restore "$project" --force-evaluate
            dotnet build "$project" --configuration Release --no-restore
          done

      - name: Run retained server unit tests
        working-directory: .proof/bitwarden-server-ci
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            test/Core.Test/Core.Test.csproj
            test/Api.Test/Api.Test.csproj
            test/Admin.Test/Admin.Test.csproj
            test/Billing.Test/Billing.Test.csproj
            test/Events.Test/Events.Test.csproj
            test/EventsProcessor.Test/EventsProcessor.Test.csproj
            test/Identity.Test/Identity.Test.csproj
            test/Notifications.Test/Notifications.Test.csproj
            test/SharedWeb.Test/SharedWeb.Test.csproj
            test/Infrastructure.Dapper.Test/Infrastructure.Dapper.Test.csproj
          )
          for project in "${tests[@]}"; do
            dotnet restore "$project" --force-evaluate
            dotnet test "$project" --configuration Debug --no-restore
          done

      - name: Verify restored server dependency boundary
        run: node scripts/check-bitwarden-server-proof.mjs .proof/bitwarden-server-ci --require-restored

  foundation-continuity-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1

      - name: Clone pinned Bitwarden SDK continuity input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          SDK_REPOSITORY="$(node -p "require('./docs/provenance/foundation-seed.json').sources.sdk.repository")"
          SDK_COMMIT="$(node -p "require('./docs/provenance/foundation-seed.json').sources.sdk.commit")"
          git clone --no-checkout "$SDK_REPOSITORY" .proof/bitwarden-sdk-continuity
          git -C .proof/bitwarden-sdk-continuity checkout --detach "$SDK_COMMIT"
          test -z "$(git -C .proof/bitwarden-sdk-continuity status --porcelain)"

      - name: Prepare cleaned SDK and selected-key continuity bridge
        run: |
          node scripts/prepare-bitwarden-sdk-proof.mjs .proof/bitwarden-sdk-continuity
          node scripts/check-bitwarden-sdk-proof.mjs .proof/bitwarden-sdk-continuity
          node scripts/prepare-safeory-continuity-sdk-proof.mjs .proof/bitwarden-sdk-continuity
          node scripts/check-safeory-continuity-sdk-proof.mjs .proof/bitwarden-sdk-continuity

      - name: Verify continuity dependency and JS/WASM boundary
        run: node scripts/check-safeory-continuity-behavior-proof.mjs

      - name: Run selected-key trustee capsule proof
        run: cargo test --manifest-path tests/foundation/continuity-behavior/Cargo.toml --locked

      - name: Run opaque-reference timed-release proof
        run: cargo test -p vault-emergency timed_release_uses_only_an_opaque_capsule_reference --locked

      - name: Re-check selected-key patch boundary
        run: |
          node scripts/check-bitwarden-sdk-proof.mjs .proof/bitwarden-sdk-continuity
          node scripts/check-safeory-continuity-sdk-proof.mjs .proof/bitwarden-sdk-continuity
          node scripts/check-safeory-continuity-behavior-proof.mjs

  foundation-server-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - foundation-server-proof
    steps:
      - uses: actions/checkout@v7

      - name: Install Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install .NET 10.0.103
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.103

      - name: Install server Rust toolchains
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Clone and prepare pinned Bitwarden server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          SERVER_REPOSITORY="$(node -p "require('./docs/provenance/foundation-seed.json').sources.server.repository")"
          SERVER_COMMIT="$(node -p "require('./docs/provenance/foundation-seed.json').sources.server.commit")"
          git clone --no-checkout "$SERVER_REPOSITORY" .proof/bitwarden-server-behavior
          git -C .proof/bitwarden-server-behavior checkout --detach "$SERVER_COMMIT"
          node scripts/prepare-bitwarden-server-proof.mjs .proof/bitwarden-server-behavior
          node scripts/check-bitwarden-server-proof.mjs .proof/bitwarden-server-behavior

      - name: Apply and verify Safeory server behavior adapters
        run: |
          node scripts/prepare-safeory-server-adapter-proof.mjs .proof/bitwarden-server-behavior
          node scripts/check-safeory-server-adapter-proof.mjs .proof/bitwarden-server-behavior

      - name: Install Safeory-owned foundation behavior harness
        run: node scripts/prepare-bitwarden-server-behavior-proof.mjs .proof/bitwarden-server-behavior

      - name: Run password-manager server behavior proof
        working-directory: .proof/bitwarden-server-behavior
        run: |
          dotnet restore test/Safeory.Foundation.ServerBehavior/Safeory.Foundation.ServerBehavior.csproj --force-evaluate
          dotnet test test/Safeory.Foundation.ServerBehavior/Safeory.Foundation.ServerBehavior.csproj --configuration Debug --no-restore --logger "console;verbosity=detailed"

      - name: Re-check server boundary after behavior proof
        run: |
          node scripts/check-bitwarden-server-proof.mjs .proof/bitwarden-server-behavior --require-restored
          node scripts/check-safeory-server-adapter-proof.mjs .proof/bitwarden-server-behavior

  foundation-server-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bitwarden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bitwarden_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Install Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install .NET 10.0.103
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.103

      - name: Clone and prepare pinned Bitwarden server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          SERVER_REPOSITORY="$(node -p "require('./docs/provenance/foundation-seed.json').sources.server.repository")"
          SERVER_COMMIT="$(node -p "require('./docs/provenance/foundation-seed.json').sources.server.commit")"
          git clone --no-checkout "$SERVER_REPOSITORY" .proof/bitwarden-server-postgres
          git -C .proof/bitwarden-server-postgres checkout --detach "$SERVER_COMMIT"
          node scripts/prepare-bitwarden-server-proof.mjs .proof/bitwarden-server-postgres
          node scripts/check-bitwarden-server-proof.mjs .proof/bitwarden-server-postgres

      - name: Restore server-local .NET tools
        working-directory: .proof/bitwarden-server-postgres
        run: dotnet tool restore

      - name: Configure disposable PostgreSQL connection
        working-directory: .proof/bitwarden-server-postgres
        run: >-
          dotnet user-secrets --project src/Api/Api.csproj set
          "GlobalSettings:PostgreSql:ConnectionString"
          "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=bitwarden_test;Include Error Detail=true"

      - name: Apply pinned PostgreSQL migration chain
        working-directory: .proof/bitwarden-server-postgres/util/PostgresMigrations
        run: dotnet ef database update

      - name: Run PostgreSQL-backed EF repository tests
        working-directory: .proof/bitwarden-server-postgres
        run: |
          dotnet restore test/Infrastructure.EFIntegration.Test/Infrastructure.EFIntegration.Test.csproj --force-evaluate
          dotnet test test/Infrastructure.EFIntegration.Test/Infrastructure.EFIntegration.Test.csproj --configuration Debug --no-restore

      - name: Verify PostgreSQL proof dependency boundary
        run: node scripts/check-bitwarden-server-proof.mjs .proof/bitwarden-server-postgres --require-restored

  foundation-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - foundation-sdk-proof
      - foundation-server-proof
    steps:
      - uses: actions/checkout@v7

      - name: Install Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install .NET 10.0.103
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.103

      - name: Install SDK Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Recreate cleaned foundation proof inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof

          SDK_REPOSITORY="$(node -p "require('./docs/provenance/foundation-seed.json').sources.sdk.repository")"
          SDK_COMMIT="$(node -p "require('./docs/provenance/foundation-seed.json').sources.sdk.commit")"
          git clone --no-checkout "$SDK_REPOSITORY" .proof/bitwarden-sdk-provenance
          git -C .proof/bitwarden-sdk-provenance checkout --detach "$SDK_COMMIT"
          node scripts/prepare-bitwarden-sdk-proof.mjs .proof/bitwarden-sdk-provenance

          SERVER_REPOSITORY="$(node -p "require('./docs/provenance/foundation-seed.json').sources.server.repository")"
          SERVER_COMMIT="$(node -p "require('./docs/provenance/foundation-seed.json').sources.server.commit")"
          git clone --no-checkout "$SERVER_REPOSITORY" .proof/bitwarden-server-provenance
          git -C .proof/bitwarden-server-provenance checkout --detach "$SERVER_COMMIT"
          node scripts/prepare-bitwarden-server-proof.mjs .proof/bitwarden-server-provenance

      - name: Restore retained server composition for dependency evidence
        working-directory: .proof/bitwarden-server-provenance
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            src/Admin/Admin.csproj
            src/Api/Api.csproj
            src/Billing/Billing.csproj
            src/Events/Events.csproj
            src/EventsProcessor/EventsProcessor.csproj
            src/Icons/Icons.csproj
            src/Identity/Identity.csproj
            src/Notifications/Notifications.csproj
            util/Migrator/Migrator.csproj
            util/PostgresMigrations/PostgresMigrations.csproj
            util/SeederApi/SeederApi.csproj
            util/Setup/Setup.csproj
            AppHost/AppHost.csproj
          )
          for project in "${projects[@]}"; do
            dotnet restore "$project" --force-evaluate
          done

      - name: Generate foundation SBOM, licenses, notices, and source manifests
        run: >-
          node scripts/generate-foundation-provenance.mjs
          .proof/bitwarden-sdk-provenance
          .proof/bitwarden-server-provenance
          docs/provenance/generated

      - name: Validate generated provenance artifacts
        run: node scripts/check-foundation-provenance.mjs docs/provenance/generated

      - name: Exercise qualified-review sign-off tooling
        run: node scripts/test-qualified-license-review-tooling.mjs docs/provenance/generated

      - name: Upload foundation provenance bundle
        uses: actions/upload-artifact@v7
        with:
          name: safeory-foundation-provenance
          path: docs/provenance/generated
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1

      - name: Install Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Bun 1.4.1
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install WASM build tooling
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Generate vault WASM package
        run: node scripts/build-vault-wasm.mjs

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Enforce foundation provenance and OSS-only boundary
        run: bun run check:foundation
      - name: Test transport-independent Safeory product domain
        run: bun run test:product-domain

      - name: Validate self-hosted Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests and migration/version checks
        run: cargo test --workspace

      - name: Frontend typecheck
        run: bun run typecheck
      - name: Browser vault tests
        run: bun run test:browser
      - name: Frontend lint
        run: bun run lint
      - name: Enforce icon-family policy
        run: bun run check:icons
      - name: Frontend build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox
      - name: Chromium extension behavior proof
        run: bun run --filter @safeory/extension test:chromium
      - name: Firefox extension behavior proof
        run: bun run --filter @safeory/extension test:firefox

      - name: Install Rust security tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Rust vulnerability audit
        run: cargo audit
      - name: Rust dependency policy
        run: cargo deny check advisories bans licenses sources
      - name: JavaScript production audit
        run: bun run audit:js
