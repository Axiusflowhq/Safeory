[workspace]
resolver = "3"
members = [
  "crates/vault-models",
  "crates/vault-crypto",
  "crates/vault-storage",
  "crates/vault-core",
  "crates/vault-platform",
  "crates/vault-sync",
  "crates/vault-sharing",
  "crates/vault-emergency",
  "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
argon2 = "=0.6.0"
chacha20poly1305 = "=0.11.0"
getrandom = "=0.4.3"
hkdf = "=0.13.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
blahaj = { version = "=0.6.0", features = ["zeroize_memory"] }
sha2 = "=0.11.0"
thiserror = "=2.0.20"
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = { version = "=1.9.0", features = ["derive"] }
