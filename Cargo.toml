[workspace]
resolver = "3"
members = [
  "apps/api",
  "crates/vault-models",
  "crates/vault-crypto",
  "crates/vault-storage",
  "crates/vault-core",
  "crates/vault-platform",
  "crates/vault-sync",
  "crates/vault-sharing",
  "crates/vault-emergency",
  "crates/vault-wasm",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
argon2 = "=0.6.0"
axum = "=0.8.9"
chacha20poly1305 = "=0.11.0"
ed25519-dalek = "=3.0.0"
getrandom = "=0.4.3"
hkdf = "=0.13.0"
hmac = "=0.13.0"
redis = { version = "=1.7.0", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "=0.40.2", features = ["backup", "bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
blahaj = { version = "=0.6.0", features = ["zeroize_memory"] }
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
thiserror = "=2.0.20"
time = "=0.3.55"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "=1.26.1", features = ["v4", "serde", "rng-getrandom"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = { version = "=1.9.0", features = ["derive"] }
