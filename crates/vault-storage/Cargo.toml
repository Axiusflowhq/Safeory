[package]
name = "vault-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dependencies]
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
vault-crypto = { path = "../vault-crypto", version = "=0.1.0" }

[dev-dependencies]
tempfile = "=3.27.0"
vault-models = { path = "../vault-models", version = "=0.1.0" }
