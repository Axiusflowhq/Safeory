[package]
name = "vault-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
vault-crypto = { path = "../vault-crypto", version = "=0.1.0" }
vault-models = { path = "../vault-models", version = "=0.1.0" }
vault-sharing = { path = "../vault-sharing", version = "=0.1.0" }
vault-storage = { path = "../vault-storage", version = "=0.1.0", default-features = false }
wasm-bindgen = "=0.2.106"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
